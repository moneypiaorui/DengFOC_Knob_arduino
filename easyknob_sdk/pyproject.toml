[project]
name = "easyknob"
version = "0.1.0"
description = "Python SDK for EasyKnob force-feedback knob control"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
