[project]
name = "easyknob-gui"
version = "0.1.0"
description = "GUI upper computer for EasyKnob force-feedback knob"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "easyknob",
]

[project.scripts]
easyknob-gui = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "i18n"]
